<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blocked — Styl</title>
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <div class="page">
    <div class="shield-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>

    <div class="site-name" id="site-name">This site</div>
    <div class="headline" id="headline">is blocked.</div>

    <div class="timer-row" id="timer-row" style="display:none">
      <span class="timer-val" id="timer-val"></span>
      <span class="timer-label">left in your session</span>
    </div>

    <!-- Confirm gate: show when gate=confirm -->
    <div class="gate confirm-gate hidden" id="confirm-gate">
      <p class="gate-label">Do you really need to go here?</p>
      <div class="gate-btns">
        <button class="gate-btn primary" id="visit-btn">Yes, take me there</button>
        <button class="gate-btn secondary" id="back-btn-confirm">← Stay focused</button>
      </div>
    </div>

    <!-- Password gate: show when gate=password -->
    <div class="gate pw-gate hidden" id="pw-gate">
      <p class="gate-label">Enter your bypass password</p>
      <div class="pw-row">
        <input class="pw-input" type="password" id="pw-input" placeholder="Password" autocomplete="off">
        <button class="gate-btn primary" id="pw-unlock-btn">Unlock</button>
      </div>
      <div class="pw-error hidden" id="pw-error">Wrong password — try again.</div>
      <button class="gate-btn secondary" id="back-btn-pw">← Stay focused</button>
    </div>

    <!-- Hard block (gate=none): just go back -->
    <button class="back-btn hard-back hidden" id="back-btn-hard">← Go back</button>

    <!-- Annoying second-gate: shown after first bypass if annoying mode is on -->
    <div class="gate annoying-gate hidden" id="annoying-gate">
      <p class="gate-label">Are you <em>really</em> sure about this?</p>
      <button class="gate-btn secondary" id="back-btn-annoying">← Actually, stay focused</button>
    </div>
  </div>

  <!-- Floating proceed button — JS sets a random position -->
  <button class="annoying-proceed hidden" id="annoying-proceed">Proceed anyway</button>

  <script src="blocked.js"></script>
</body>
</html>
