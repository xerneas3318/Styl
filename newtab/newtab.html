<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moments</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body class="night">
  <div class="page">

    <!-- Clock & date -->
    <div class="hero">
      <div class="clock" id="clock">00:00</div>
      <div class="date"  id="date"></div>
      <div class="greeting" id="greeting"></div>
    </div>

    <!-- Daily focus -->
    <div class="focus-block">
      <div class="focus-label">What is your main focus today?</div>
      <input
        class="focus-input"
        id="focus-input"
        type="text"
        placeholder="Enter your intention…"
        maxlength="120"
        autocomplete="off"
        spellcheck="false"
      >
    </div>

    <!-- Timer card -->
    <div class="timer-card">
      <div class="mode-tabs">
        <button class="mode-tab active" data-mode="focus">Focus</button>
        <button class="mode-tab" data-mode="break">Short Break</button>
        <button class="mode-tab" data-mode="longBreak">Long Break</button>
      </div>

      <div class="ring-wrap">
        <svg viewBox="0 0 160 160" class="ring-svg">
          <circle class="ring-bg" cx="80" cy="80" r="68"/>
          <circle class="ring-fg" id="progress-ring" cx="80" cy="80" r="68"
            stroke-dasharray="427.26" stroke-dashoffset="0"/>
        </svg>
        <div class="timer-display">
          <span class="time-text" id="time-text" title="Click to change duration">25:00</span>
          <div class="time-editor hidden" id="time-editor">
            <input type="number" id="time-edit" min="1" max="180" placeholder="25">
            <span class="edit-unit">min</span>
          </div>
        </div>
      </div>
      <div class="preset-bar hidden" id="preset-bar"></div>

      <div class="timer-controls">
        <button class="t-btn icon-btn" id="reset-btn" title="Reset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 1 0 .49-3.5"/>
          </svg>
        </button>
        <button class="t-btn main-btn" id="start-pause-btn">Start</button>
        <button class="t-btn icon-btn" id="skip-btn" title="Skip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 4 15 12 5 20 5 4"/>
            <line x1="19" y1="5" x2="19" y2="19"/>
          </svg>
        </button>
      </div>

      <div class="sessions-row">
        <div class="sessions-dots" id="sessions-dots"></div>
        <span class="sessions-label" id="sessions-label">0 sessions completed</span>
      </div>
    </div>

    <!-- Quote -->
    <div class="quote" id="quote"></div>

  </div>

  <!-- Wallpaper controls (bottom-right corner) -->
  <div class="wallpaper-controls">
    <input type="file" id="wallpaper-file" accept="image/*" hidden>
    <button class="wallpaper-btn" id="wallpaper-upload-btn" title="Change wallpaper">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
    </button>
    <button class="wallpaper-btn wallpaper-remove hidden" id="wallpaper-remove-btn" title="Remove wallpaper">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <script src="../shared/sound.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
