<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moments</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <span class="brand">Moments</span>
    <button class="icon-btn" id="settings-toggle" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>

  <!-- Mode tabs -->
  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="focus">Focus</button>
    <button class="mode-tab" data-mode="break">Break</button>
    <button class="mode-tab" data-mode="longBreak">Long Break</button>
  </div>

  <!-- Timer ring -->
  <div class="timer-ring-wrap">
    <svg viewBox="0 0 120 120" class="ring-svg">
      <circle class="ring-bg" cx="60" cy="60" r="52"/>
      <circle class="ring-fg" id="progress-ring" cx="60" cy="60" r="52"
        stroke-dasharray="326.73" stroke-dashoffset="0"/>
    </svg>
    <div class="timer-display" id="timer-display">25:00</div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="ctrl-btn secondary" id="reset-btn" title="Reset">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <polyline points="1 4 1 10 7 10"/>
        <path d="M3.51 15a9 9 0 1 0 .49-3.5"/>
      </svg>
    </button>
    <button class="ctrl-btn primary" id="start-pause-btn">Start</button>
    <button class="ctrl-btn secondary" id="skip-btn" title="Skip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="5 4 15 12 5 20 5 4"/>
        <line x1="19" y1="5" x2="19" y2="19"/>
      </svg>
    </button>
  </div>

  <!-- Sessions -->
  <div class="sessions-row">
    <div class="sessions-dots" id="sessions-dots"></div>
    <span class="sessions-label" id="sessions-label">0 sessions today</span>
  </div>

  <!-- Settings panel -->
  <div class="settings-panel" id="settings-panel">
    <h3 class="settings-title">Timer Durations</h3>
    <div class="settings-grid">
      <label>
        <span>Focus</span>
        <div class="input-row">
          <input type="number" id="focus-input" min="1" max="99" value="25">
          <span class="unit">min</span>
        </div>
      </label>
      <label>
        <span>Short Break</span>
        <div class="input-row">
          <input type="number" id="break-input" min="1" max="99" value="5">
          <span class="unit">min</span>
        </div>
      </label>
      <label>
        <span>Long Break</span>
        <div class="input-row">
          <input type="number" id="long-break-input" min="1" max="99" value="15">
          <span class="unit">min</span>
        </div>
      </label>
    </div>
    <button class="save-btn" id="save-btn">Save</button>
  </div>

  <script src="../shared/sound.js"></script>
  <script src="popup.js"></script>
</body>
</html>
