<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Styl — Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
<div class="settings-page">

  <div class="settings-header">
    <span class="brand">Styl</span>
    <span class="settings-title">Settings</span>
  </div>

  <div class="tab-nav">
    <button class="tab-btn active" data-tab="appearance">Appearance</button>
    <button class="tab-btn" data-tab="timer">Timer</button>
    <button class="tab-btn" data-tab="api">API</button>
  </div>

  <div class="status-msg hidden" id="status-msg"></div>

  <!-- Appearance tab -->
  <div class="tab-panel" id="tab-appearance">
    <div class="section-label">Theme</div>
    <div class="chip-row" id="theme-chips">
      <button class="chip active" data-theme="dark">Dark</button>
      <button class="chip" data-theme="light">Light</button>
      <button class="chip" data-theme="system">System</button>
    </div>

    <div class="section-label" style="margin-top:20px">Text Size</div>
    <div class="chip-row" id="size-chips">
      <button class="chip" data-size="small">Small</button>
      <button class="chip active" data-size="medium">Medium</button>
      <button class="chip" data-size="large">Large</button>
    </div>
  </div>

  <!-- Timer tab -->
  <div class="tab-panel hidden" id="tab-timer">
    <div class="section-label">Timer Defaults</div>
    <div class="field-group">
      <label class="field-label" for="focus-dur">Focus duration (minutes)</label>
      <input id="focus-dur" type="number" class="field-input narrow" min="1" max="180" value="25">
    </div>
    <div class="field-group">
      <label class="field-label" for="break-dur">Short break (minutes)</label>
      <input id="break-dur" type="number" class="field-input narrow" min="1" max="60" value="5">
    </div>
    <div class="field-group">
      <label class="field-label" for="long-break-dur">Long break (minutes)</label>
      <input id="long-break-dur" type="number" class="field-input narrow" min="1" max="90" value="15">
    </div>
  </div>

  <!-- API tab -->
  <div class="tab-panel hidden" id="tab-api">
    <div class="section-label">Claude API</div>
    <div class="field-group">
      <label class="field-label" for="api-key">API Key</label>
      <input id="api-key" type="password" class="field-input" placeholder="sk-ant-…" autocomplete="off">
      <div class="field-hint">Stored locally only. Used for AI-powered features.</div>
    </div>
  </div>

  <div class="settings-footer">
    <button class="btn-primary" id="save-btn">Save</button>
  </div>

</div>
<script src="../dist/settings.js"></script>
</body>
</html>
